name: SkyDash
options:
  bundleIdPrefix: com.skydash
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_XR_DESIGNED_FOR: "NO"
targets:
  SkyDash:
    type: application
    platform: iOS
    sources:
      - path: SkyDash
        excludes:
          - Resources/Assets.xcassets
    resources:
      - path: SkyDash/Resources/Assets.xcassets
      - path: SkyDash/Resources/Base.lproj
    settings:
      base:
        INFOPLIST_FILE: SkyDash/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.skydash.game
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarHidden: "YES"
    dependencies: []
schemes:
  SkyDash:
    build:
      targets:
        SkyDash: all
    run:
      config: Debug
    archive:
      config: Release
