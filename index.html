<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Dash</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { display: block; cursor: pointer; border-radius: 8px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ============================================================
//  SKY DASH – Endless Runner (Single-file HTML5 game)
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// --- Responsive sizing (16:9 landscape) ---
function resize() {
    const ratio = 16 / 9;
    let w = window.innerWidth - 20;
    let h = window.innerHeight - 20;
    if (w / h > ratio) w = h * ratio; else h = w / ratio;
    canvas.width = Math.floor(w);
    canvas.height = Math.floor(h);
}
resize();
window.addEventListener('resize', resize);

// Scale helper – all game logic uses a virtual 800×450 coordinate space
function S(v) { return v * canvas.width / 800; }
function SY(v) { return v * canvas.height / 450; }

// ===================== AUDIO (procedural) =====================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function ensureAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
function playTone(startFreq, endFreq, duration, vol) {
    ensureAudio();
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(endFreq, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(vol || 0.12, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}
const Sound = {
    jump()    { playTone(440, 660, 0.1, 0.1); },
    coin()    { playTone(880, 1100, 0.08, 0.1); },
    death()   { playTone(440, 110, 0.3, 0.15); },
    powerUp() { playTone(440, 880, 0.15, 0.1); },
    shield()  { playTone(330, 220, 0.12, 0.1); },
};

// ===================== PERSISTENT STORAGE =====================
const Store = {
    get(k, d) { try { const v = localStorage.getItem('sd_'+k); return v !== null ? JSON.parse(v) : d; } catch(e) { return d; } },
    set(k, v) { try { localStorage.setItem('sd_'+k, JSON.stringify(v)); } catch(e) {} },
};

// ===================== CONFIG =====================
const CFG = {
    groundY: 370,
    playerX: 120,
    playerSize: 28,
    gravity: 1400,
    jumpForce: -520,
    maxJumps: 2,
    slideDuration: 0.6,
    initialSpeed: 240,
    maxSpeed: 520,
    speedAccel: 3,
    obstacleMinInt: 1.2,
    obstacleMaxInt: 2.6,
    coinInterval: 2.0,
    powerUpChance: 0.08,
    shieldDur: 5,
    magnetDur: 8,
    multiplierDur: 10,
    magnetRange: 120,
    magnetPull: 300,
    coinPoints: 10,
};

const SKINS = [
    { name: 'Classic', color: '#ff6b35', price: 0 },
    { name: 'Ocean',   color: '#3399ee', price: 100 },
    { name: 'Forest',  color: '#33bb44', price: 200 },
    { name: 'Mystic',  color: '#9944ee', price: 300 },
    { name: 'Golden',  color: '#ffd700', price: 400 },
    { name: 'Rainbow', color: '#ff66aa', price: 500 },
];

// ===================== GAME STATE =====================
let scene = 'menu'; // menu, game, gameover, store
let gameState = 'waiting'; // waiting, playing, dead
let score, coinsThisRun, speed, difficulty, frameCount;
let player, obstacles, coins, powerUps;
let obstacleTimer, coinTimer;
let shakeTimer = 0, shakeMag = 0;
let flashAlpha = 0;
let deathTimer = 0;
let titleBob = 0;

// Background layers
let clouds = [], mountains = [];
function initBg() {
    clouds = [];
    for (let i = 0; i < 6; i++) {
        clouds.push({ x: Math.random() * 800, y: 30 + Math.random() * 140, w: 50 + Math.random() * 60, h: 20 + Math.random() * 15, a: 0.3 + Math.random() * 0.4 });
    }
    mountains = [];
    for (let i = 0; i < 5; i++) {
        mountains.push({ x: i * 200 - 100 + Math.random() * 80, w: 100 + Math.random() * 100, h: 60 + Math.random() * 80 });
    }
}
initBg();

// ===================== PLAYER =====================
function createPlayer() {
    return {
        x: CFG.playerX, y: CFG.groundY - CFG.playerSize,
        vy: 0, jumps: CFG.maxJumps,
        grounded: true, sliding: false, slideTimer: 0,
        scaleX: 1, scaleY: 1, dead: false, rotation: 0,
        alpha: 1,
        shield: 0, magnet: 0, multiplier: 0,
    };
}

// ===================== DRAWING HELPERS =====================
function drawRoundedRect(x, y, w, h, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
    ctx.fill();
}

function drawTriangle(cx, baseY, w, h, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx, baseY - h);
    ctx.lineTo(cx - w/2, baseY);
    ctx.lineTo(cx + w/2, baseY);
    ctx.closePath();
    ctx.fill();
}

function drawCircle(cx, cy, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fill();
}

function drawText(text, x, y, size, color, align, bold) {
    ctx.fillStyle = color || '#fff';
    ctx.font = (bold ? 'bold ' : '') + S(size) + 'px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, S(x), SY(y));
}

function drawButton(text, x, y, w, h, color, hover) {
    const sx = S(x), sy = SY(y), sw = S(w), sh = SY(h);
    const scale = hover ? 0.95 : 1;
    const dx = sw * (1-scale)/2, dy = sh * (1-scale)/2;
    drawRoundedRect(sx+dx, sy+dy, sw*scale, sh*scale, S(8), color);
    drawText(text, x + w/2, y + h/2, 18, '#fff', 'center', true);
    return { x: sx, y: sy, w: sw, h: sh };
}

// ===================== BACKGROUND DRAWING =====================
function drawBackground(scrollSpeed, dt) {
    // Sky gradient
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#4a8fd9');
    grad.addColorStop(1, '#87ceeb');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Clouds
    for (const c of clouds) {
        c.x -= scrollSpeed * 0.04 * dt;
        if (c.x + c.w < -20) c.x = 820 + Math.random() * 50;
        ctx.globalAlpha = c.a;
        drawCircle(S(c.x), SY(c.y), S(c.w/3), '#fff');
        drawCircle(S(c.x + c.w*0.25), SY(c.y - c.h*0.2), S(c.w/2.5), '#fff');
        drawCircle(S(c.x + c.w*0.55), SY(c.y), S(c.w/3.2), '#fff');
        ctx.globalAlpha = 1;
    }

    // Mountains
    for (const m of mountains) {
        m.x -= scrollSpeed * 0.08 * dt;
        if (m.x + m.w < -60) m.x = 860 + Math.random() * 100;
        ctx.globalAlpha = 0.5;
        drawTriangle(S(m.x + m.w/2), SY(CFG.groundY), S(m.w), SY(m.h), '#4a8a4a');
        ctx.globalAlpha = 1;
    }

    // Ground dirt
    ctx.fillStyle = '#785533';
    ctx.fillRect(0, SY(CFG.groundY), canvas.width, SY(80));

    // Grass
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(0, SY(CFG.groundY), canvas.width, SY(12));

    // Grass tufts
    ctx.fillStyle = '#388e3c';
    for (let i = 0; i < 800; i += 30) {
        const tx = S(i);
        const ty = SY(CFG.groundY);
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(tx - S(3), ty - SY(6));
        ctx.lineTo(tx + S(3), ty);
        ctx.fill();
    }
}

// ===================== PLAYER DRAWING =====================
function drawPlayer(p) {
    if (p.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = p.alpha;

    const cx = S(p.x), cy = SY(p.y);
    const sz = S(CFG.playerSize);
    const sw = sz * p.scaleX, sh = sz * p.scaleY;

    ctx.translate(cx, cy + sh/2);
    ctx.rotate(p.rotation);
    ctx.translate(-cx, -(cy + sh/2));

    // Get skin color
    const skinName = Store.get('skin', 'Classic');
    const skin = SKINS.find(s => s.name === skinName) || SKINS[0];

    // Body
    drawRoundedRect(cx - sw/2, cy, sw, sh, S(5), skin.color);

    // Shield visual
    if (p.shield > 0) {
        ctx.strokeStyle = 'rgba(0, 190, 212, ' + (0.4 + Math.sin(Date.now()/200)*0.2) + ')';
        ctx.lineWidth = S(3);
        ctx.beginPath();
        ctx.arc(cx, cy + sh/2, sw * 0.75, 0, Math.PI * 2);
        ctx.stroke();
        if (p.shield < 1.5) {
            ctx.strokeStyle = 'rgba(0, 190, 212, ' + (Math.sin(Date.now()/80) > 0 ? 0.7 : 0.1) + ')';
            ctx.stroke();
        }
    }

    // Magnet visual
    if (p.magnet > 0) {
        ctx.strokeStyle = 'rgba(245, 66, 143, ' + (0.2 + Math.sin(Date.now()/300)*0.15) + ')';
        ctx.lineWidth = S(2);
        ctx.beginPath();
        ctx.arc(cx, cy + sh/2, sw * 0.9, 0, Math.PI * 2);
        ctx.stroke();
    }

    if (!p.sliding) {
        // Eyes
        const eyeY = cy + sh * 0.3;
        const eyeSize = S(5);
        drawCircle(cx - sw*0.2, eyeY, eyeSize, '#fff');
        drawCircle(cx + sw*0.2, eyeY, eyeSize, '#fff');
        // Pupils
        const pupilOff = p.grounded ? S(1.5) : 0;
        drawCircle(cx - sw*0.2 + pupilOff, eyeY, eyeSize*0.5, '#222');
        drawCircle(cx + sw*0.2 + pupilOff, eyeY, eyeSize*0.5, '#222');
        // Smile
        ctx.strokeStyle = '#5d2a0c';
        ctx.lineWidth = S(1.5);
        ctx.beginPath();
        ctx.arc(cx + S(2), cy + sh*0.6, S(6), 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.stroke();
    }

    // Multiplier label
    if (p.multiplier > 0) {
        drawText('x2', p.x, p.y - 18, 14, '#00e676', 'center', true);
        if (p.multiplier < 1.5 && Math.sin(Date.now()/80) > 0) {
            drawText('x2', p.x, p.y - 18, 14, 'rgba(0,230,70,0.3)', 'center', true);
        }
    }

    ctx.restore();
}

// ===================== OBSTACLE DRAWING =====================
function drawObstacle(o) {
    if (o.type === 'spike') {
        drawTriangle(S(o.x), SY(CFG.groundY), S(28), SY(o.h), '#e63737');
    } else if (o.type === 'doublespike') {
        drawTriangle(S(o.x), SY(CFG.groundY), S(30), SY(o.h), '#e63737');
        // Darker inner triangle
        drawTriangle(S(o.x), SY(CFG.groundY), S(16), SY(o.h * 0.6), '#b32828');
    } else if (o.type === 'barrier') {
        // Top barrier block
        const bw = 30, bh = 50;
        const topY = CFG.groundY - o.gapBottom - bh;
        drawRoundedRect(S(o.x - bw/2), SY(topY), S(bw), SY(bh), S(3), '#e63737');
        // Warning stripes
        ctx.fillStyle = '#b32828';
        ctx.fillRect(S(o.x - bw/2 + 3), SY(topY + bh*0.3), S(bw - 6), SY(bh*0.15));
        ctx.fillRect(S(o.x - bw/2 + 3), SY(topY + bh*0.55), S(bw - 6), SY(bh*0.15));
        // Support pole
        ctx.fillStyle = '#b32828';
        ctx.fillRect(S(o.x - 3), SY(topY + bh), S(6), SY(o.gapBottom));
    }
}

// ===================== COIN / POWERUP DRAWING =====================
function drawCoin(c) {
    const bob = Math.sin(Date.now() / 250 + c.bobOff) * 4;
    const cy = c.y + bob;
    drawCircle(S(c.x), SY(cy), S(8), '#ffd700');
    // Inner star
    const rot = Date.now() / 500 + c.bobOff;
    const sr = S(4);
    ctx.fillStyle = '#fff3a0';
    ctx.save();
    ctx.translate(S(c.x), SY(cy));
    ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2;
        ctx.lineTo(Math.cos(a) * sr, Math.sin(a) * sr);
        const a2 = ((i + 0.5) / 4) * Math.PI * 2;
        ctx.lineTo(Math.cos(a2) * sr * 0.4, Math.sin(a2) * sr * 0.4);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function drawPowerUp(pu) {
    const bob = Math.sin(Date.now() / 300 + pu.bobOff) * 5;
    const cy = pu.y + bob;
    const pulse = 1 + Math.sin(Date.now() / 200) * 0.08;
    const colors = { shield: '#00bcd4', magnet: '#f5428f', multiplier: '#00e676' };
    const labels = { shield: 'S', magnet: 'M', multiplier: 'x2' };
    drawCircle(S(pu.x), SY(cy), S(10 * pulse), colors[pu.type]);
    drawText(labels[pu.type], pu.x, cy, 10, '#fff', 'center', true);
}

// ===================== PARTICLES =====================
let particles = [];
let floatingTexts = [];

function spawnCoinParticles(x, y) {
    for (let i = 0; i < 6; i++) {
        particles.push({
            x, y, vx: (Math.random()-0.5)*200, vy: -100 - Math.random()*200,
            life: 0.4, maxLife: 0.4, size: 3, color: '#ffd700'
        });
    }
}

function spawnFloatingText(x, y, text, color) {
    floatingTexts.push({ x, y, text, color: color || '#ffd700', life: 0.7, maxLife: 0.7 });
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 600 * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 60 * dt;
        ft.life -= dt;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        drawCircle(S(p.x), SY(p.y), S(p.size), p.color);
    }
    ctx.globalAlpha = 1;
    for (const ft of floatingTexts) {
        ctx.globalAlpha = ft.life / ft.maxLife;
        drawText(ft.text, ft.x, ft.y, 12, ft.color, 'center', true);
    }
    ctx.globalAlpha = 1;
}

// ===================== MENU SCENE =====================
let menuButtons = [];

function drawMenu() {
    const dt = 1/60;
    drawBackground(60, dt);

    titleBob += dt;
    const bobY = Math.sin(titleBob * 2) * 8;

    // Title shadow
    drawText('SKY DASH', 402, 102 + bobY, 42, 'rgba(0,0,0,0.3)', 'center', true);
    // Title
    drawText('SKY DASH', 400, 100 + bobY, 42, '#ff6b35', 'center', true);

    // Subtitle
    drawText('Space / Click = Jump   |   S / Down = Slide', 400, 160, 11, 'rgba(255,255,255,0.7)', 'center');

    menuButtons = [];
    menuButtons.push({ ...drawButton('PLAY', 300, 200, 200, 50, '#ff6b35'), action: 'play' });
    menuButtons.push({ ...drawButton('STORE', 320, 270, 160, 40, '#4a8fd9'), action: 'store' });

    const hs = Store.get('highscore', 0);
    if (hs > 0) drawText('BEST: ' + hs.toLocaleString(), 400, 340, 13, 'rgba(255,255,255,0.6)', 'center');

    // Coin counter
    drawCircle(S(720), SY(30), S(8), '#ffd700');
    drawText(Store.get('coins', 0).toString(), 740, 30, 12, '#fff', 'left', true);
}

// ===================== GAME SCENE =====================
function startRun() {
    scene = 'game';
    gameState = 'waiting';
    score = 0;
    coinsThisRun = 0;
    speed = CFG.initialSpeed;
    difficulty = 0;
    frameCount = 0;
    player = createPlayer();
    obstacles = [];
    coins = [];
    powerUps = [];
    particles = [];
    floatingTexts = [];
    obstacleTimer = 2;
    coinTimer = 1;
    shakeTimer = 0;
    flashAlpha = 0;
    deathTimer = 0;
}

function startPlaying() {
    ensureAudio();
    gameState = 'playing';
    player.vy = 0;
    player.jumps = CFG.maxJumps;
    Store.set('gamesPlayed', Store.get('gamesPlayed', 0) + 1);
}

function playerJump() {
    if (player.dead) return;
    if (player.jumps <= 0) return;
    player.jumps--;
    player.vy = CFG.jumpForce;
    player.grounded = false;
    player.scaleX = 0.85; player.scaleY = 1.15;
    Sound.jump();
}

function playerSlide() {
    if (player.dead || player.sliding || !player.grounded) return;
    player.sliding = true;
    player.slideTimer = CFG.slideDuration;
}

function updateGame(dt) {
    if (gameState === 'waiting') {
        drawBackground(60, dt);
        drawPlayer(player);
        const pulse = 0.5 + Math.abs(Math.sin(Date.now()/500)) * 0.5;
        ctx.globalAlpha = pulse;
        drawText('PRESS SPACE TO START', 400, 180, 18, '#fff', 'center', true);
        ctx.globalAlpha = 1;
        return;
    }

    if (gameState === 'dead') {
        deathTimer += dt;
        // Continue drawing but with death animation
        drawBackground(0, dt);
        drawObstaclesAndCoins();
        player.vy += CFG.gravity * dt;
        player.y += player.vy * dt;
        player.x -= 40 * dt;
        player.rotation += 12 * dt;
        player.alpha = Math.max(0, 1 - deathTimer * 1.2);
        drawPlayer(player);
        drawHUD();
        drawParticles();

        // Red flash
        if (flashAlpha > 0) {
            ctx.fillStyle = 'rgba(255,0,0,' + flashAlpha + ')';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            flashAlpha -= dt * 2;
        }

        // Camera shake
        if (shakeTimer > 0) shakeTimer -= dt;

        if (deathTimer > 1.5) {
            // Transition to game over
            const isNewBest = score > Store.get('highscore', 0);
            if (isNewBest) Store.set('highscore', score);
            Store.set('coins', Store.get('coins', 0) + coinsThisRun);
            scene = 'gameover';
            gameOverData = { score, coins: coinsThisRun, isNewBest, highScore: Store.get('highscore', 0) };
        }
        return;
    }

    // === PLAYING ===
    speed = Math.min(speed + CFG.speedAccel * dt * 10, CFG.maxSpeed);
    difficulty = (speed - CFG.initialSpeed) / (CFG.maxSpeed - CFG.initialSpeed);

    // Score
    frameCount++;
    if (frameCount >= 3) {
        frameCount = 0;
        const mult = player.multiplier > 0 ? 2 : 1;
        score += mult;
    }

    // Power-up timers
    if (player.shield > 0) player.shield -= dt;
    if (player.magnet > 0) player.magnet -= dt;
    if (player.multiplier > 0) player.multiplier -= dt;

    // Player physics
    if (!player.grounded) {
        player.vy += CFG.gravity * dt;
        player.y += player.vy * dt;
    }

    // Ground collision
    if (player.y >= CFG.groundY - CFG.playerSize * player.scaleY) {
        player.y = CFG.groundY - CFG.playerSize * player.scaleY;
        player.vy = 0;
        if (!player.grounded) {
            player.grounded = true;
            player.jumps = CFG.maxJumps;
            player.scaleX = 1.15; player.scaleY = 0.85;
        }
    }

    // Sliding
    if (player.sliding) {
        player.slideTimer -= dt;
        player.scaleX = 1.3; player.scaleY = 0.5;
        if (player.slideTimer <= 0) {
            player.sliding = false;
        }
    }

    // Scale recovery
    if (!player.sliding) {
        if (player.grounded) {
            const t = Math.sin(Date.now() / 125) * 0.5 + 0.5;
            player.scaleX += (((1 + (1 - t) * 0.05) - player.scaleX)) * 8 * dt;
            player.scaleY += (((1 - (1 - t) * 0.05 + t * 0.05) - player.scaleY)) * 8 * dt;
        } else {
            player.scaleX += (1 - player.scaleX) * 8 * dt;
            player.scaleY += (1 - player.scaleY) * 8 * dt;
        }
    }

    // Spawn obstacles
    obstacleTimer -= dt;
    if (obstacleTimer <= 0) {
        spawnObstacle();
        const min = CFG.obstacleMinInt - difficulty * 0.4;
        const max = CFG.obstacleMaxInt - difficulty * 0.8;
        obstacleTimer = Math.max(0.7, min) + Math.random() * Math.max(0.3, max - min);
    }

    // Spawn coins
    coinTimer -= dt;
    if (coinTimer <= 0) {
        coinTimer = CFG.coinInterval;
        if (Math.random() < CFG.powerUpChance) {
            spawnPowerUpItem();
        } else {
            spawnCoinPattern();
        }
    }

    // Update obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.x -= speed * dt;
        if (o.x < -40) { obstacles.splice(i, 1); continue; }
        if (checkObstacleCollision(player, o)) {
            if (player.shield > 0) {
                player.shield = 0;
                obstacles.splice(i, 1);
                Sound.shield();
                // Flash
                flashAlpha = 0.15;
            } else {
                die();
            }
        }
    }

    // Update coins
    for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        c.x -= speed * dt;

        // Magnet pull
        if (player.magnet > 0) {
            const dx = player.x - c.x, dy = (player.y + CFG.playerSize/2) - c.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < CFG.magnetRange) {
                c.x += (dx / dist) * CFG.magnetPull * dt;
                c.y += (dy / dist) * CFG.magnetPull * dt;
            }
        }

        if (c.x < -20) { coins.splice(i, 1); continue; }
        if (checkCoinCollision(player, c)) {
            const mult = player.multiplier > 0 ? 2 : 1;
            score += CFG.coinPoints * mult;
            coinsThisRun++;
            spawnCoinParticles(c.x, c.y);
            spawnFloatingText(c.x, c.y - 15, '+' + (CFG.coinPoints * mult));
            Sound.coin();
            coins.splice(i, 1);
        }
    }

    // Update power-ups
    for (let i = powerUps.length - 1; i >= 0; i--) {
        const pu = powerUps[i];
        pu.x -= speed * dt;
        if (pu.x < -20) { powerUps.splice(i, 1); continue; }
        if (checkCoinCollision(player, pu)) {
            activatePowerUp(pu.type);
            Sound.powerUp();
            powerUps.splice(i, 1);
        }
    }

    updateParticles(dt);

    // Camera shake
    if (shakeTimer > 0) shakeTimer -= dt;

    // --- DRAW ---
    ctx.save();
    if (shakeTimer > 0) {
        const sx = (Math.random()-0.5) * shakeMag * (shakeTimer/0.4);
        const sy = (Math.random()-0.5) * shakeMag * (shakeTimer/0.4);
        ctx.translate(S(sx), SY(sy));
    }

    drawBackground(speed, dt);
    drawObstaclesAndCoins();
    drawPlayer(player);
    drawParticles();

    ctx.restore();

    // Flash
    if (flashAlpha > 0) {
        ctx.fillStyle = 'rgba(255,0,0,' + flashAlpha + ')';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        flashAlpha -= dt * 2;
    }

    drawHUD();
}

function drawObstaclesAndCoins() {
    for (const o of obstacles) drawObstacle(o);
    for (const c of coins) drawCoin(c);
    for (const pu of powerUps) drawPowerUp(pu);
}

function drawHUD() {
    // Score
    drawText(score.toLocaleString(), 400, 28, 22, '#fff', 'center', true);
    // Score shadow
    ctx.globalAlpha = 0.3;
    drawText(score.toLocaleString(), 401, 29, 22, '#000', 'center', true);
    ctx.globalAlpha = 1;

    // Coin counter
    drawCircle(S(720), SY(28), S(7), '#ffd700');
    drawText((Store.get('coins', 0) + coinsThisRun).toString(), 738, 28, 11, '#fff', 'left', true);
}

function spawnObstacle() {
    const roll = Math.random();
    if (difficulty > 0.5 && roll < 0.15) {
        obstacles.push({ type: 'doublespike', x: 820, h: 70, hitW: 24, hitH: 65 });
    } else if (roll < 0.5) {
        obstacles.push({ type: 'barrier', x: 820, gapBottom: 34, hitW: 26, hitH: 50, hitTopY: CFG.groundY - 34 - 50 });
    } else {
        obstacles.push({ type: 'spike', x: 820, h: 42, hitW: 20, hitH: 38 });
    }
}

function spawnCoinPattern() {
    const pattern = Math.floor(Math.random() * 3);
    const count = 1 + Math.floor(Math.random() * 4);
    const baseY = CFG.groundY - 55;
    for (let i = 0; i < count; i++) {
        let x = 830 + i * 35;
        let y = baseY;
        if (pattern === 1) y -= Math.sin(i / count * Math.PI) * 70; // arc
        else if (pattern === 2) y -= i * 25; // ascending
        coins.push({ x, y, bobOff: Math.random() * Math.PI * 2 });
    }
}

function spawnPowerUpItem() {
    const types = ['shield', 'magnet', 'multiplier'];
    const type = types[Math.floor(Math.random() * types.length)];
    powerUps.push({ x: 830, y: CFG.groundY - 70, type, bobOff: Math.random() * Math.PI * 2 });
}

function activatePowerUp(type) {
    if (type === 'shield') player.shield = CFG.shieldDur;
    else if (type === 'magnet') player.magnet = CFG.magnetDur;
    else if (type === 'multiplier') player.multiplier = CFG.multiplierDur;
}

function checkObstacleCollision(p, o) {
    const px = p.x - CFG.playerSize * p.scaleX / 2;
    const py = p.y;
    const pw = CFG.playerSize * p.scaleX;
    const ph = CFG.playerSize * p.scaleY;

    if (o.type === 'spike' || o.type === 'doublespike') {
        const ox = o.x - o.hitW/2;
        const oy = CFG.groundY - o.hitH;
        return rectsOverlap(px, py, pw, ph, ox, oy, o.hitW, o.hitH);
    } else if (o.type === 'barrier') {
        // Hit the top block only (player can slide under the gap)
        const ox = o.x - o.hitW/2;
        const oy = o.hitTopY;
        return rectsOverlap(px, py, pw, ph, ox, oy, o.hitW, o.hitH);
    }
    return false;
}

function checkCoinCollision(p, c) {
    const dx = (p.x) - c.x;
    const dy = (p.y + CFG.playerSize * p.scaleY / 2) - c.y;
    return Math.sqrt(dx*dx + dy*dy) < CFG.playerSize * 0.6 + 8;
}

function rectsOverlap(x1,y1,w1,h1, x2,y2,w2,h2) {
    return x1 < x2+w2 && x1+w1 > x2 && y1 < y2+h2 && y1+h1 > y2;
}

function die() {
    gameState = 'dead';
    player.dead = true;
    player.vy = -300;
    flashAlpha = 0.35;
    shakeTimer = 0.4;
    shakeMag = 8;
    deathTimer = 0;
    Sound.death();
}

// ===================== GAME OVER SCENE =====================
let gameOverData = {};
let gameOverButtons = [];
let gameOverPulse = 0;

function drawGameOver(dt) {
    gameOverPulse += dt;
    drawBackground(20, dt);

    // Dark overlay
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawText('GAME OVER', 400, 65, 36, '#fff', 'center', true);

    if (gameOverData.isNewBest) {
        const scale = 1 + Math.sin(gameOverPulse * 3) * 0.06;
        ctx.save();
        ctx.translate(S(400), SY(110));
        ctx.scale(scale, scale);
        ctx.translate(-S(400), -SY(110));
        drawText('NEW BEST!', 400, 110, 18, '#ffd700', 'center', true);
        ctx.restore();
    }

    // Score panel
    drawRoundedRect(S(250), SY(140), S(300), SY(130), S(10), 'rgba(0,0,0,0.5)');
    drawText('SCORE', 400, 165, 10, 'rgba(255,255,255,0.6)', 'center');
    drawText(gameOverData.score.toLocaleString(), 400, 195, 26, '#fff', 'center', true);
    drawText('COINS', 330, 235, 9, 'rgba(255,255,255,0.6)', 'center');
    drawText(gameOverData.coins.toString(), 330, 255, 16, '#ffd700', 'center', true);
    drawText('BEST', 470, 235, 9, 'rgba(255,255,255,0.6)', 'center');
    drawText(gameOverData.highScore.toLocaleString(), 470, 255, 16, '#fff', 'center', true);

    gameOverButtons = [];
    gameOverButtons.push({ ...drawButton('PLAY AGAIN', 280, 295, 240, 45, '#ff6b35'), action: 'play' });
    gameOverButtons.push({ ...drawButton('MENU', 320, 355, 160, 38, '#4a8fd9'), action: 'menu' });

    drawText('Press SPACE to restart  |  ESC for menu', 400, 415, 9, 'rgba(255,255,255,0.4)', 'center');
}

// ===================== STORE SCENE =====================
let storeButtons = [];

function drawStore(dt) {
    drawBackground(30, dt);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawText('STORE', 400, 40, 30, '#fff', 'center', true);
    drawText('CHARACTER SKINS', 400, 80, 12, 'rgba(255,255,255,0.7)', 'center');

    // Coin counter
    drawCircle(S(700), SY(38), S(8), '#ffd700');
    drawText(Store.get('coins', 0).toString(), 718, 38, 12, '#fff', 'left', true);

    const selectedSkin = Store.get('skin', 'Classic');
    const unlockedStr = Store.get('unlocked', 'Classic');

    storeButtons = [];
    const startX = 400 - (SKINS.length - 1) * 55 / 2;

    for (let i = 0; i < SKINS.length; i++) {
        const skin = SKINS[i];
        const cx = startX + i * 55;
        const cy = 155;
        const isUnlocked = unlockedStr.includes(skin.name);
        const isSelected = selectedSkin === skin.name;

        // Selection ring
        if (isSelected) {
            drawCircle(S(cx), SY(cy), S(24), 'rgba(255,255,255,0.8)');
        }

        // Skin circle
        const col = isUnlocked ? skin.color : 'rgba(80,80,80,0.7)';
        drawCircle(S(cx), SY(cy), S(20), col);

        // Eyes
        if (isUnlocked) {
            drawCircle(S(cx-6), SY(cy-4), S(4), '#fff');
            drawCircle(S(cx+6), SY(cy-4), S(4), '#fff');
            drawCircle(S(cx-5), SY(cy-4), S(2), '#222');
            drawCircle(S(cx+7), SY(cy-4), S(2), '#222');
        }

        // Name
        drawText(skin.name, cx, cy + 30, 8, '#fff', 'center');

        // Price
        if (!isUnlocked) {
            drawText(skin.price + ' coins', cx, cy + 42, 7, '#ffd700', 'center');
        } else if (isSelected) {
            drawText('EQUIPPED', cx, cy + 42, 7, '#00e676', 'center');
        }

        // Click area
        storeButtons.push({ x: S(cx-22), y: SY(cy-22), w: S(44), h: SY(44), action: 'skin', index: i });
    }

    drawText('Earn coins by collecting them during runs!', 400, 240, 9, 'rgba(255,255,255,0.5)', 'center');

    storeButtons.push({ ...drawButton('BACK', 340, 280, 120, 38, '#4a8fd9'), action: 'back' });

    drawText('Press ESC to go back', 400, 340, 8, 'rgba(255,255,255,0.35)', 'center');
}

function handleStoreClick(index) {
    const skin = SKINS[index];
    const unlockedStr = Store.get('unlocked', 'Classic');
    const isUnlocked = unlockedStr.includes(skin.name);

    if (isUnlocked) {
        Store.set('skin', skin.name);
        Sound.coin();
    } else {
        const totalCoins = Store.get('coins', 0);
        if (totalCoins >= skin.price) {
            Store.set('coins', totalCoins - skin.price);
            Store.set('unlocked', unlockedStr + ',' + skin.name);
            Store.set('skin', skin.name);
            Sound.powerUp();
        }
    }
}

// ===================== INPUT =====================
let keys = {};
window.addEventListener('keydown', e => {
    if (keys[e.code]) return;
    keys[e.code] = true;

    if (scene === 'menu') {
        if (e.code === 'Space' || e.code === 'Enter') startRun();
    } else if (scene === 'game') {
        if (gameState === 'waiting') {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') startPlaying();
        } else if (gameState === 'playing') {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') playerJump();
            if (e.code === 'ArrowDown' || e.code === 'KeyS') playerSlide();
        }
        if (e.code === 'Escape') { scene = 'menu'; }
    } else if (scene === 'gameover') {
        if (e.code === 'Space' || e.code === 'Enter') startRun();
        if (e.code === 'Escape') scene = 'menu';
    } else if (scene === 'store') {
        if (e.code === 'Escape') scene = 'menu';
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Touch / mouse support
let touchStartY = 0;
canvas.addEventListener('mousedown', e => { touchStartY = e.clientY; });
canvas.addEventListener('mouseup', e => {
    const dy = e.clientY - touchStartY;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / rect.width;
    const my = (e.clientY - rect.top) / rect.height;

    if (scene === 'menu') {
        for (const b of menuButtons) {
            if (hitTest(e, b)) {
                if (b.action === 'play') startRun();
                if (b.action === 'store') scene = 'store';
                return;
            }
        }
    } else if (scene === 'game') {
        if (gameState === 'waiting') { startPlaying(); return; }
        if (gameState === 'playing') {
            if (dy > 30) playerSlide();
            else playerJump();
        }
    } else if (scene === 'gameover') {
        for (const b of gameOverButtons) {
            if (hitTest(e, b)) {
                if (b.action === 'play') startRun();
                if (b.action === 'menu') scene = 'menu';
                return;
            }
        }
    } else if (scene === 'store') {
        for (const b of storeButtons) {
            if (hitTest(e, b)) {
                if (b.action === 'skin') handleStoreClick(b.index);
                if (b.action === 'back') scene = 'menu';
                return;
            }
        }
    }
});

function hitTest(e, btn) {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    return mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h;
}

// ===================== MAIN LOOP =====================
let lastTime = performance.now();

function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (scene === 'menu') drawMenu();
    else if (scene === 'game') updateGame(dt);
    else if (scene === 'gameover') drawGameOver(dt);
    else if (scene === 'store') drawStore(dt);

    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
